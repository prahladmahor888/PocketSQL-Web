<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Outer Frame -->
  <rect width="800" height="500" rx="10" fill="#0F172A"/>
  <!-- Top Bar -->
  <rect width="800" height="42" rx="10" fill="#1E293B"/>
  <rect y="32" width="800" height="10" fill="#1E293B"/>
  <circle cx="25" cy="21" r="6" fill="#EF4444"/>
  <circle cx="45" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="65" cy="21" r="6" fill="#10B981"/>
  <text x="400" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="600">PocketSQL Server Manager — Android Foreground REST Daemon</text>

  <g transform="translate(40, 65)">
    <!-- Server Status Top Card -->
    <rect x="0" y="0" width="720" height="120" rx="8" fill="#1E293B" stroke="#334155"/>
    
    <!-- Status Dot -->
    <circle cx="35" cy="35" r="10" fill="#10B981" fill-opacity="0.3"/>
    <circle cx="35" cy="35" r="5" fill="#10B981"/>
    
    <text x="60" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#F8FAFC" font-weight="800">API Server: ACTIVE &amp; LISTENING</text>
    <rect x="580" y="22" width="120" height="32" rx="6" fill="#EF4444"/>
    <text x="640" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">Stop Server</text>

    <!-- IP & Port info row -->
    <g transform="translate(30, 75)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">ENDPOINT:</text>
      <text x="80" y="15" font-family="'JetBrains Mono', monospace" font-size="13" fill="#38BDF8" font-weight="700">http://192.168.1.100:8080/api/query</text>
      
      <text x="420" y="15" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">TLS 1.3:</text>
      <text x="480" y="15" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10B981" font-weight="700">Enabled (Port 8443)</text>
    </g>

    <!-- API Keys Management -->
    <text x="0" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#F8FAFC" font-weight="700">Active Bearer API Tokens (Database Scoped)</text>
    
    <rect x="0" y="170" width="720" height="210" rx="8" fill="#1E293B" stroke="#334155"/>
    
    <!-- Key 1 -->
    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="680" height="50" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="15" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F8FAFC" font-weight="600">psk_live_99f82ab...10e4</text>
      <rect x="240" y="14" width="100" height="24" rx="4" fill="#2563EB" fill-opacity="0.2"/>
      <text x="290" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" text-anchor="middle">ecommerce</text>
      <rect x="350" y="14" width="90" height="24" rx="4" fill="#10B981" fill-opacity="0.2"/>
      <text x="395" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981" text-anchor="middle">Read / Write</text>
      <text x="590" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Created 2d ago</text>
    </g>

    <!-- Key 2 -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="680" height="50" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="15" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F8FAFC" font-weight="600">psk_ro_41cc81d...89f2</text>
      <rect x="240" y="14" width="100" height="24" rx="4" fill="#2563EB" fill-opacity="0.2"/>
      <text x="290" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" text-anchor="middle">analytics</text>
      <rect x="350" y="14" width="90" height="24" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="395" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F59E0B" text-anchor="middle">Read Only</text>
      <text x="590" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Created 5h ago</text>
    </g>

    <!-- New Key CTA -->
    <rect x="20" y="325" width="160" height="36" rx="6" fill="#2563EB"/>
    <text x="100" y="347" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">+ Generate New Key</text>
  </g>
</svg>
