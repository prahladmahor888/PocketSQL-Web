<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Outer Frame -->
  <rect width="800" height="500" rx="10" fill="#0F172A"/>
  <!-- Top Bar -->
  <rect width="800" height="42" rx="10" fill="#1E293B"/>
  <rect y="32" width="800" height="10" fill="#1E293B"/>
  <!-- Window Controls -->
  <circle cx="25" cy="21" r="6" fill="#EF4444"/>
  <circle cx="45" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="65" cy="21" r="6" fill="#10B981"/>
  <!-- Title -->
  <text x="400" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="600">PocketSQL Terminal — session #1 (127.0.0.1:8080)</text>
  
  <!-- Terminal Content -->
  <g transform="translate(30, 70)">
    <!-- Welcome ASCII/Banner -->
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38BDF8" font-weight="700">  ____            _        _   ____   ___  _     </text>
    <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38BDF8" font-weight="700"> |  _ \ ___   ___| | _____| |_/ ___| / _ \| |    </text>
    <text x="0" y="56" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38BDF8" font-weight="700"> | |_) / _ \ / __| |/ / _ \ __\___ \| | | | |    </text>
    <text x="0" y="74" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38BDF8" font-weight="700"> |  __/ (_) | (__|   <  __/ |_ ___) | |_| | |___ </text>
    <text x="0" y="92" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38BDF8" font-weight="700"> |_|   \___/ \___|_|\_\___|\__|____/ \__\_\\_____|</text>

    <!-- Version & Server Status -->
    <text x="0" y="130" font-family="'JetBrains Mono', monospace" font-size="13" fill="#E2E8F0">PocketSQL Engine v1.0.5 (Android ARM64 / Java 17 Engine)</text>
    <text x="0" y="152" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">Connection: Local Socket &amp; REST Server [Active on port 8080]</text>
    <text x="0" y="174" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94A3B8">Type 'HELP;' or '\h' for help. Type '\c' to clear current input buffer.</text>

    <!-- Prompt 1 -->
    <text x="0" y="215" font-family="'JetBrains Mono', monospace" font-size="13" fill="#10B981" font-weight="600">pocketsql&gt;</text>
    <text x="90" y="215" font-family="'JetBrains Mono', monospace" font-size="13" fill="#F8FAFC">SHOW DATABASES;</text>

    <!-- Output Box -->
    <rect x="0" y="230" width="360" height="120" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="15" y="252" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">+--------------------+---------+</text>
    <text x="15" y="272" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38BDF8">| Database           | Tables  |</text>
    <text x="15" y="292" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">+--------------------+---------+</text>
    <text x="15" y="312" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F8FAFC">| ecommerce_production| 14      |</text>
    <text x="15" y="332" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F8FAFC">| telemetry_logs      | 8       |</text>
    
    <text x="0" y="375" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">2 rows in set (0.84 ms)</text>

    <!-- Active Prompt with cursor -->
    <text x="0" y="405" font-family="'JetBrains Mono', monospace" font-size="13" fill="#10B981" font-weight="600">pocketsql&gt;</text>
    <text x="90" y="405" font-family="'JetBrains Mono', monospace" font-size="13" fill="#F8FAFC">USE ecommerce_production;</text>
    <rect x="305" y="392" width="8" height="16" fill="#38BDF8"/>
