    <!-- Database cylinder stacks with pocket shape -->
    <path d="M22 26C22 22.6863 30.0589 20 40 20C49.9411 20 58 22.6863 58 26C58 29.3137 49.9411 32 40 32C30.0589 32 22 29.3137 22 26Z" fill="#FFFFFF"/>
